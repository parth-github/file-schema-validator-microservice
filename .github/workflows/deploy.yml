# GitHub Actions CI/CD pipeline
name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to ECS
        run: |
          # Add your deployment commands here
          echo "Deploying to ECS..."
          aws ecr get-login-password --region us-east-1| docker login --username AWS --password-stdin 177099687008.dkr.ecr.us-east-1.amazonaws.com
          docker tag fastapi-fargate 177099687008.dkr.ecr.us-east-1.amazonaws.com/fastapi-fargate:latestdocker push 177099687008.dkr.ecr.us-east-1.amazonaws.com/fastapi-fargate:latest